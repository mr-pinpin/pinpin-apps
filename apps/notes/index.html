<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes board</title>
<style>
  #board { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 0.45rem; }
  .note { border-radius: 0.25rem; padding: 0.35rem 0.45rem; color: #1b1b1b; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
          box-shadow: 0 0.1rem 0.3rem #0008; }
  .note .n { font-size: 0.6rem; font-weight: 800; opacity: 0.55; display: flex; justify-content: space-between; }
  .note .t { flex: 1; font-size: 1.05rem; line-height: 1.15; font-weight: 700; overflow: hidden; }
  .c0 { background: #ffd166; } .c1 { background: #8ecae6; } .c2 { background: #b8e0a0; } .c3 { background: #f4a6a6; } .c4 { background: #d7b9f0; }
  .note.fresh { outline: 0.12rem solid var(--pp-fg); }
  .empty { grid-column: 1 / -1; font-size: 1.1rem; color: var(--pp-muted); align-self: center; text-align: center; }
</style>
</head>
<body>
<header class="pp-row"><h1>Notes</h1><div class="pp-grow"></div><div id="count" class="pp-muted pp-small"></div></header>
<main id="board" class="pp-grow"></main>
<div class="pp-hint">Say <b>note: call the plumber</b> · <b>delete note 2</b> · <b>clear the board</b></div>
<script>
const $ = (id) => document.getElementById(id);
let notes = [], freshId = 0;  // [{id, t, at}] newest first

function save() { pinpin.store.set('notes', notes); }
function ago(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return 'now'; if (m < 60) return m + ' min'; const h = Math.round(m / 60); if (h < 24) return h + ' h';
  return new Date(ms).toLocaleDateString([], { day: 'numeric', month: 'short' });
}
function render() {
  const max = pinpin.config.max_notes || 9;
  $('count').textContent = notes.length > max ? `${notes.length - max} older not shown` : '';
  $('board').innerHTML = notes.length ? notes.slice(0, max).map((n, i) =>
    `<div class="note c${n.id % 5}${n.id === freshId ? ' fresh' : ''}"><div class="n"><span>${i + 1}</span><span>${ago(n.at)}</span></div><div class="t">${pinpin.escape(n.t)}</div></div>`).join('')
    : '<div class="empty">No notes yet. Say “note: buy batteries”.</div>';
  document.querySelectorAll('.note .t').forEach((e) => pinpin.fit(e, { max: 1, min: 0.5 }));
}

const ORD = { one: 1, first: 1, two: 2, second: 2, three: 3, third: 3, four: 4, fourth: 4, five: 5, fifth: 5, six: 6, seven: 7, eight: 8, nine: 9, last: -1 };
pinpin.onVoice((text) => {
  let t = text.trim().replace(/\s+/g, ' ');
  let m;
  if (/^(clear|wipe|empty)( the| all)?( board| notes)?[.!]?$/i.test(t) || /^delete (all|everything)( notes)?[.!]?$/i.test(t)) { notes = []; save(); render(); return pinpin.toast('Board cleared'); }
  if ((m = t.match(/^(?:delete|remove|done with|tear off|throw away)\s+(?:the\s+)?(?:note\s+)?(?:number\s+)?(\d+|one|two|three|four|five|six|seven|eight|nine|first|second|third|fourth|fifth|last)(?:\s+note)?[.!]?$/i))) {
    let k = /\d/.test(m[1]) ? +m[1] : ORD[m[1].toLowerCase()];
    if (k === -1) k = Math.min(notes.length, pinpin.config.max_notes || 9);
    if (!notes[k - 1]) return pinpin.toast('There is no note ' + k);
    notes.splice(k - 1, 1); save(); return render();
  }
  if ((m = t.match(/^(?:delete|remove)\s+(?:the\s+)?(?:note\s+)?(?:about|with|saying)\s+(.+)$/i))) {
    const q = m[1].toLowerCase().replace(/[.!?]+$/, ''), k = notes.findIndex((n) => n.t.toLowerCase().includes(q));
    if (k < 0) return pinpin.toast('No note about “' + m[1] + '”');
    notes.splice(k, 1); save(); return render();
  }
  t = t.replace(/^(?:new note|note|add a note|add note|write|remember|reminder|remind me to)\s*[:,-]?\s*/i, '');
  if (!t) return pinpin.toast('Say “note: …”');
  t = t.charAt(0).toUpperCase() + t.slice(1);
  freshId = Date.now();
  notes.unshift({ id: freshId, t: t.slice(0, 200), at: Date.now() });
  save(); render();
});

pinpin.ready.then(() => { notes = pinpin.store.get('notes', []); render(); setInterval(render, 60000); });
</script>
</body>
</html>
