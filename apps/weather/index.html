<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weather</title>
<style>
  header { display: flex; justify-content: space-between; align-items: baseline; }
  #now { display: flex; align-items: center; gap: 1rem; }
  #icon { font-size: 4rem; line-height: 1; }
  #cond { font-size: 1.3rem; }
  #facts { margin-left: auto; text-align: right; font-size: 0.9rem; line-height: 1.35; }
  #hours, #days { display: grid; gap: 0.3rem; }
  #hours { grid-template-columns: repeat(8, 1fr); }
  #days { grid-template-columns: repeat(5, 1fr); margin-bottom: 0.45rem; }
  .cell { text-align: center; padding: 0.25rem 0.1rem; }
  .cell .t { font-size: 0.65rem; color: var(--pp-muted); }
  .cell .i { font-size: 1.1rem; line-height: 1.3; }
  .cell .v { font-size: 0.8rem; }
  .cell .r { font-size: 0.55rem; color: var(--pp-cool); min-height: 0.7rem; }
  .hi { color: var(--pp-fg); } .lo { color: var(--pp-muted); }
</style>
</head>
<body>
<header><h1 id="place">Weather</h1><div class="pp-big" id="clock"></div></header>
<section id="now">
  <div id="icon">·</div>
  <div><div class="pp-huge" id="temp">--°</div><div id="cond" class="pp-muted">loading…</div></div>
  <div id="facts"></div>
</section>
<section id="hours" class="pp-grow"></section>
<section id="days"></section>
<script>
const WMO = {0: ['Clear', '☀️', '🌙'], 1: ['Mostly clear', '🌤️', '🌙'], 2: ['Partly cloudy', '⛅', '☁️'], 3: ['Overcast', '☁️'],
  45: ['Fog', '🌫️'], 48: ['Freezing fog', '🌫️'], 51: ['Light drizzle', '🌦️'], 53: ['Drizzle', '🌦️'], 55: ['Heavy drizzle', '🌧️'],
  56: ['Freezing drizzle', '🌧️'], 57: ['Freezing drizzle', '🌧️'], 61: ['Light rain', '🌦️'], 63: ['Rain', '🌧️'], 65: ['Heavy rain', '🌧️'],
  66: ['Freezing rain', '🌧️'], 67: ['Freezing rain', '🌧️'], 71: ['Light snow', '🌨️'], 73: ['Snow', '🌨️'], 75: ['Heavy snow', '❄️'],
  77: ['Snow grains', '🌨️'], 80: ['Showers', '🌦️'], 81: ['Showers', '🌧️'], 82: ['Violent showers', '⛈️'], 85: ['Snow showers', '🌨️'],
  86: ['Snow showers', '❄️'], 95: ['Thunderstorm', '⛈️'], 96: ['Thunderstorm, hail', '⛈️'], 99: ['Thunderstorm, hail', '⛈️']};
const wmo = (c, day = 1) => { const w = WMO[c] || ['—', '·']; return { text: w[0], icon: (!day && w[2]) || w[1] }; };
const $ = (id) => document.getElementById(id);
const deg = (v) => Math.round(v) + '°';
let cfg, timer;

function hhmm(d) { return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }); }
function tick() { $('clock').textContent = hhmm(new Date()); }

function render(w) {
  const c = w.current;  // timezone=auto: times are the place's local time
  $('place').textContent = cfg.place;
  const now = wmo(c.weather_code, c.is_day);
  $('icon').textContent = now.icon;
  $('temp').textContent = deg(c.temperature_2m);
  $('cond').textContent = now.text + ' · feels ' + deg(c.apparent_temperature);
  const d = w.daily;
  $('facts').innerHTML = `<div><span class="hi">${deg(d.temperature_2m_max[0])}</span> / <span class="lo">${deg(d.temperature_2m_min[0])}</span></div>` +
    `<div class="pp-muted">wind ${Math.round(c.wind_speed_10m)} km/h</div><div class="pp-muted">humidity ${c.relative_humidity_2m}%</div>`;
  const h = w.hourly, start = h.time.findIndex((t) => t >= c.time.slice(0, 13));
  $('hours').innerHTML = h.time.slice(start + 1, start + 9).map((t, k) => {
    const i = start + 1 + k, x = wmo(h.weather_code[i], h.is_day ? h.is_day[i] : 1), p = h.precipitation_probability[i];
    return `<div class="pp-card cell"><div class="t">${t.slice(11, 13)}h</div><div class="i">${x.icon}</div><div class="v">${deg(h.temperature_2m[i])}</div><div class="r">${p >= 20 ? p + '%' : ''}</div></div>`;
  }).join('');
  $('days').innerHTML = d.time.slice(1, 6).map((t, k) => {
    const i = k + 1, x = wmo(d.weather_code[i]), p = d.precipitation_probability_max[i];
    const name = new Date(t + 'T12:00').toLocaleDateString([], { weekday: 'short' });
    return `<div class="pp-card cell"><div class="t">${name}</div><div class="i">${x.icon}</div><div class="v"><span class="hi">${deg(d.temperature_2m_max[i])}</span> <span class="lo">${deg(d.temperature_2m_min[i])}</span></div><div class="r">${p >= 20 ? p + '%' : ''}</div></div>`;
  }).join('');
  pinpin.status('updated ' + hhmm(new Date(w.fetched)));
}

async function load() {
  const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + cfg.lat + '&longitude=' + cfg.lon +
    '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,is_day' +
    '&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&timezone=auto&forecast_days=6&temperature_unit=' + (cfg.units === 'fahrenheit' ? 'fahrenheit' : 'celsius');
  try {
    const w = await pinpin.fetchJSON(u);
    if (w._stale) throw new Error('stale');  // the Mini served its last copy: the internet is down
    w.fetched = Date.now(); w.place = cfg.place;
    pinpin.store.set('last', w);
    render(w);
    pinpin.offline(false);
  } catch (e) {
    const last = pinpin.store.get('last');
    if (last && last.place === cfg.place) { render(last); pinpin.offline(true, 'offline · ' + hhmm(new Date(last.fetched))); }
    else { $('cond').textContent = 'No weather yet: offline'; pinpin.offline(true); }
  }
}

async function setPlace(name) {
  try {
    const g = await pinpin.fetchJSON('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=' + encodeURIComponent(name));
    const r = g.results && g.results[0];
    if (!r) return pinpin.toast('No place called “' + name + '”');
    cfg = Object.assign({}, cfg, { place: r.name, lat: r.latitude, lon: r.longitude });
    pinpin.store.set('config', Object.assign(pinpin.store.get('config', {}), { place: r.name, lat: r.latitude, lon: r.longitude }));
    pinpin.toast(r.name + (r.country ? ', ' + r.country : ''));
    load();
  } catch (e) { pinpin.toast('Could not look that up'); }
}

pinpin.onVoice((text) => {
  const t = text.trim().replace(/[.!?]+$/, '');
  // a place only from a phrase that starts like one ("in Paris", "weather for Rome", "change to Oslo"), never from
  // the middle of a sentence ("what is it" is not a place)
  let m = t.match(/^(?:(?:the\s+)?(?:weather|forecast)\s+)?(?:in|for|at)\s+(.+)$/i) || t.match(/^(?:show|set|change(?: place)? to)\s+(.+)$/i);
  if (/\b(refresh|update|reload)\b/i.test(t)) return load();
  if (/\bfahrenheit\b/i.test(t)) { cfg.units = 'fahrenheit'; pinpin.store.set('config', Object.assign(pinpin.store.get('config', {}), { units: 'fahrenheit' })); return load(); }
  if (/\b(celsius|centigrade)\b/i.test(t)) { cfg.units = 'celsius'; pinpin.store.set('config', Object.assign(pinpin.store.get('config', {}), { units: 'celsius' })); return load(); }
  if (m) return setPlace(m[1]);
  const words = t.toLowerCase().split(/\s+/);
  if (words.length <= 3 && !words.some((w) => /^(what|is|it|its|it's|how|the|a|an|please|thanks|thank|you|show|me|today|now|tomorrow|weather|forecast|time|clock|and|or|no|yes|ok|okay|stop|again|refresh|update)$/.test(w))) return setPlace(t);  // a bare city name
  pinpin.toast('Say “weather in <city>”');
});

pinpin.ready.then(() => {
  cfg = pinpin.config;
  tick(); setInterval(tick, 10000);
  const last = pinpin.store.get('last');
  if (last && last.place === cfg.place) render(last);
  load();
  timer = setInterval(load, (cfg.refresh_min || 10) * 60000);
});
</script>
</body>
</html>
